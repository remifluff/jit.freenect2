[package]
name = "jit-k2nect"
version = "0.1.0"
edition = "2021"

[lib]
name = "jit_k2nect"
crate-type = ["cdylib"]

[dependencies]
# NOTE: This crate intentionally does NOT depend on max-sdk-rs / max-sys / median.
# Jitter externals are loaded by the Jitter subsystem which does not export
# `_common_symbols`, causing dlopen failures if median (or anything pulling it
# in via ext_main!) is linked. All Max/Jitter API calls go through
# jitter_bridge.cpp using raw extern "C" declarations + memoffset for layout.
memoffset = "0.9"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
