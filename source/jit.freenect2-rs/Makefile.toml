[config]
default_to_workspace = false

[tasks.build]
command = "cargo"
args = ["build", "--release"]

[tasks.install]
dependencies = ["build"]
script_runner = "@shell"
script = '''
BUNDLE=../../externals/jit.freenect2_rs.mxo
DEST=$BUNDLE/Contents/MacOS/jit.freenect2_rs
cp target/release/libjit_freenect2.dylib "$DEST"
install_name_tool -id "@loader_path/jit.freenect2_rs" "$DEST"
# Ensure Info.plist exists (codesign must bind it)
if [ ! -f "$BUNDLE/Contents/Info.plist" ]; then
    echo "ERROR: $BUNDLE/Contents/Info.plist missing — bundle structure is broken" >&2
    exit 1
fi
xattr -cr "$BUNDLE"
codesign --force -s - "$BUNDLE"
echo "Installed to jit.freenect2_rs.mxo"
'''

[tasks.default]
alias = "install"
